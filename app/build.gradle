apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'realm-android'

// Add the Firebase Crashlytics plugin.
apply plugin: 'com.google.firebase.crashlytics'

def versionMajor = 3
def versionMinor = 5
def versionPatch = 0
def versionBuild = 1

def appVersionBuild = Integer.valueOf(System.env.GITHUB_RUN_NUMBER ?: versionBuild)

android {
    namespace 'online.taxcore.pos'

    compileSdk 36

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId "online.taxcore.pos"

        minSdk 24
        targetSdk 36

        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch * 10 + appVersionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        archivesBaseName = "TaxCore-MobilePOS-$versionCode-v$versionName"

        multiDexEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file(DEBUG_KEYSTORE_PATH)
            storePassword DEBUG_KEYSTORE_PASS
            keyAlias DEBUG_KEY_ALIAS
            keyPassword DEBUG_KEY_PASS
        }

        /**SIGNING_CONFIG**/
    }

    buildTypes {

        debug {

            versionNameSuffix "-debug"
            applicationIdSuffix ".debug"

            debuggable true
            minifyEnabled false

            signingConfig signingConfigs.debug
        }

        /**BUILD_TYPE**/
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xskip-metadata-version-check', '-Xallow-kotlin-package']
    }
    
    kapt {
        correctErrorTypes = true
        useBuildCache = true
    }

    tasks.register('printVersionInformation') {
        doLast {
            // Full version with build number
            println defaultConfig.versionName
            // Version without build number
            println "${versionMajor}.${versionMinor}.${versionPatch}"
        }
    }

}

ext {
    support = "28.0.0"
    dagger = "2.21"
    permission = "3.1.0"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:$kotlin_version"))

    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    //Android libs
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.security:security-crypto:1.0.0"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"

    implementation "com.google.android.material:material:1.12.0"

    // dagger
    implementation "com.google.dagger:dagger:$dagger"
    implementation "com.google.dagger:dagger-android:$dagger"
    implementation "com.google.dagger:dagger-android-support:$dagger"
    kapt "com.google.dagger:dagger-compiler:$dagger"
    kapt "com.google.dagger:dagger-android-processor:$dagger"

    //retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"

    //Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    kapt "com.github.bumptech.glide:compiler:4.16.0"

    // Material dialogs
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:files:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.afollestad.material-dialogs:bottomsheets:3.3.0'
    implementation 'com.afollestad.material-dialogs:datetime:3.3.0'

    implementation 'io.github.chaosleung:pinview:1.4.4'

    implementation "org.greenrobot:eventbus:3.3.1"
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'io.github.inflationx:viewpump:2.1.1'
    implementation "com.itextpdf:itext7-core:7.2.5"
    implementation "com.madgag:scpkix-jdk15on:1.47.0.3"

    implementation "com.github.vicpinm:krealmextensions:2.5.0"

    // Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'

    //Permission
    implementation 'com.karumi:dexter:6.2.3'

    implementation "me.dm7.barcodescanner:zxing:1.9.8"
}

apply plugin: 'com.google.gms.google-services'
